[package]
name = "slipway-root"
description = "The three programs that run as root (install, roll back, health record) and the code only they need"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# These programs run with the administrator's rights, so what they link is kept short and is checked by
# scripts/check-boundary.sh: no network client, no bus, no async runtime, no logging framework.
[[bin]]
name = "slipway-apply"
path = "src/bin/slipway_apply.rs"

[[bin]]
name = "slipway-rollback"
path = "src/bin/slipway_rollback.rs"

[[bin]]
name = "slipway-health"
path = "src/bin/slipway_health.rs"

[dependencies]
slipway-core.workspace = true
thiserror.workspace = true
semver.workspace = true
toml.workspace = true
rustix.workspace = true
tar.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
